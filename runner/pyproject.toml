[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "artex-kali-runner"
version = "0.1.0"
description = "Typed non-web capability runner for ARTEX (Phase 1 network pack)"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0,<5",
    "uvicorn>=0.30,<1",
    "pydantic>=2.7,<3",
    "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "httpx>=0.27,<1",
]

[project.scripts]
artex-kali-runner = "runner.server:main"

[tool.setuptools.packages.find]
include = ["runner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
